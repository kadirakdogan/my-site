<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c" />
      <stop offset="50%" stop-color="#111218" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>

    <radialGradient id="glow-cyan" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-violet" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="accent-stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="420" fill="url(#glow-cyan)" rx="16" />
  <rect width="1200" height="420" fill="url(#glow-violet)" rx="16" />

  <!-- Subtle Grid Pattern -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="420" />
    <line x1="200" y1="0" x2="200" y2="420" />
    <line x1="320" y1="0" x2="320" y2="420" />
    <line x1="440" y1="0" x2="440" y2="420" />
    <line x1="560" y1="0" x2="560" y2="420" />
    <line x1="680" y1="0" x2="680" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="920" y1="0" x2="920" y2="420" />
    <line x1="1040" y1="0" x2="1040" y2="420" />
    <line x1="1160" y1="0" x2="1160" y2="420" />
    
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
  </g>

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />
  
  <!-- Accent Top Line -->
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#accent-stroke)" />

  <!-- Status Pill -->
  <g transform="translate(70, 52)">
    <rect width="250" height="32" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="18" cy="16" r="4.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="20.5" fill="#a1a1aa" font-size="12" font-weight="500" class="font-sans">
      Available for Opportunities &amp; Projects
    </text>
  </g>

  <!-- Live Link Badge -->
  <g transform="translate(930, 52)">
    <rect width="200" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="18" cy="16" r="3.5" fill="#38bdf8" />
    <text x="32" y="20.5" fill="#38bdf8" font-size="12" font-weight="600" class="font-mono">
      kadirakdogan.vercel.app
    </text>
  </g>

  <!-- Monogram Logo Box -->
  <g transform="translate(70, 110)">
    <rect width="72" height="72" rx="16" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" filter="url(#card-shadow)" />
    <text x="36" y="45" fill="#ffffff" font-size="28" font-weight="800" text-anchor="middle" class="font-mono" letter-spacing="-1">
      KA
    </text>
  </g>

  <!-- Main Titles -->
  <g transform="translate(162, 126)">
    <text x="0" y="28" fill="#ffffff" font-size="38" font-weight="800" class="font-sans" letter-spacing="-0.5">
      Kadir Akdoğan
    </text>
    <text x="0" y="56" fill="#38bdf8" font-size="15" font-weight="600" class="font-mono" letter-spacing="1.5">
      IT SUPPORT SPECIALIST  /  NETWORK &amp; SYSTEMS ADMINISTRATOR
    </text>
  </g>

  <!-- Description paragraph -->
  <text x="70" y="224" fill="#94a3b8" font-size="16" class="font-sans" line-height="24">
    Production-grade enterprise portfolio showcasing end-to-end IT support, network topology &amp; routing (MikroTik/Ubiquiti),
  </text>
  <text x="70" y="250" fill="#94a3b8" font-size="16" class="font-sans" line-height="24">
    Windows Server infrastructure, ERP management (Akınsoft), structured cabling, and CCTV systems.
  </text>

  <!-- Feature / Tech Badges (Bottom Row) -->
  <g transform="translate(70, 305)">
    <!-- Badge: Next.js 14 -->
    <g transform="translate(0, 0)">
      <rect width="130" height="42" rx="10" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
      <text x="65" y="26" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle" class="font-mono">▲ Next.js 14</text>
    </g>

    <!-- Badge: TypeScript -->
    <g transform="translate(142, 0)">
      <rect width="130" height="42" rx="10" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
      <text x="65" y="26" fill="#60a5fa" font-size="13" font-weight="600" text-anchor="middle" class="font-mono">TS TypeScript</text>
    </g>

    <!-- Badge: Tailwind CSS -->
    <g transform="translate(284, 0)">
      <rect width="130" height="42" rx="10" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
      <text x="65" y="26" fill="#38bdf8" font-size="13" font-weight="600" text-anchor="middle" class="font-mono">≈ Tailwind CSS</text>
    </g>

    <!-- Badge: Framer Motion -->
    <g transform="translate(426, 0)">
      <rect width="145" height="42" rx="10" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
      <text x="72.5" y="26" fill="#f43f5e" font-size="13" font-weight="600" text-anchor="middle" class="font-mono">✦ Framer Motion</text>
    </g>

    <!-- Badge: Dual Mode Dark/Light -->
    <g transform="translate(583, 0)">
      <rect width="150" height="42" rx="10" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
      <text x="75" y="26" fill="#fbbf24" font-size="13" font-weight="600" text-anchor="middle" class="font-sans">◑ Dark &amp; Light</text>
    </g>

    <!-- Badge: Bilingual TR / EN -->
    <g transform="translate(745, 0)">
      <rect width="140" height="42" rx="10" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
      <text x="70" y="26" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle" class="font-sans">🇹🇷 TR / 🇬🇧 EN</text>
    </g>

    <!-- Badge: Live CV Viewer -->
    <g transform="translate(897, 0)">
      <rect width="163" height="42" rx="10" fill="url(#card-grad)" stroke="#34d399" stroke-opacity="0.4" stroke-width="1" />
      <text x="81.5" y="26" fill="#34d399" font-size="13" font-weight="600" text-anchor="middle" class="font-sans">📄 Live CV Viewer</text>
    </g>
  </g>

  <!-- Bottom micro indicator -->
  <text x="70" y="388" fill="#64748b" font-size="12" class="font-mono">
    Enterprise Architecture • Zero 3rd-party CSS • Serverless Contact Route • Strict Content Security Policy
  </text>
</svg>
